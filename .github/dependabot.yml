version: 2
updates:
  # 1. NPM Dependencies
  - package-ecosystem: "npm"
    directory: "/"
    # Check for updates weekly on Monday morning (start of the sprint)
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata" # India Standard Time
    # GitHub flow branching strategy
    target-branch: "main"

    open-pull-requests-limit: 10

    groups:
      production-dependencies:
        patterns:
          - "*"
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        patterns:
          - "*"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # 2. GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
