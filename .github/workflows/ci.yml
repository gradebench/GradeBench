name: CI Pipeline Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: 🏗️ Build Code
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v5

      - name: 📦 Restore Turborepo Build Cache
        id: cache-turbo
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            **/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: 🟢 Setup Node JS
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 🏞️ Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 🏞️ Lint
        run: biome ci .

      - name: 🧪 Unit Test
        run: npm run test

      - name: ⚙️ Build
        run: npm run build

      - name: 🔎 Type Check
        run: npm run check-types
