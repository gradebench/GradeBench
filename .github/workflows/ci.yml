name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 🔍 Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 📥 Install Dependencies
        run: npm ci --prefer-offline

      - name: 🏞️ Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: 🧹 Lint & Format Check
        run: |
          biome ci .

  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 📥 Install Dependencies
        run: npm ci --prefer-offline

      - name: 🔍 Audit Dependencies
        run: npm audit --audit-level=high

      - name: 🛡️ Check for Known Vulnerabilities
        run: npx audit-ci --high

  typecheck:
    name: 🔎 Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate]
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 📦 Restore Turborepo Cache
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            **/.turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-turbo-

      - name: 📥 Install Dependencies
        run: npm ci --prefer-offline

      - name: 🔎 Type Check
        run: npm run check-types

  # Unit tests with coverage
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validate]

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 📦 Restore Turborepo Cache
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            **/.turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-turbo-

      - name: 📥 Install Dependencies
        run: npm ci --prefer-offline

      - name: 🧪 Run Tests
        run: npm run test

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate, typecheck]

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 📦 Restore Turborepo Cache
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            **/.turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-turbo-

      - name: 📥 Install Dependencies
        run: npm ci --prefer-offline

      - name: 🏗️ Build Applications
        run: npm run build
