name: CI Pipeline Workflow

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build:
    name: 🏗️ Build Code
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Cache Setup
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha}}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: 🟢 Setup Node JS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📥 Install Dependencies
        run: npm install

      - name: 🧹 Lint
        run: npm run lint

      - name: 🧪 Unit Test
        run: npm run test

      - name: ⚙️ Build
        run: npm run build

      - name: 🔎 Type Check
        run: npm run check-types
